# Explicações em linguagem simples das votações, escritas por um agente ou pelo dono.
#
# O bot usa o texto daqui no título da capa, no slide "O que está em votação" e
# na legenda, no lugar da ementa oficial (que continua na legenda e no link da
# fonte). Ao salvar este arquivo no GitHub, o bot refaz sozinho os rascunhos
# afetados e manda a versão nova no Telegram. Todo post com texto daqui chega
# com o alerta "confira se está correta e neutra".
#
# Para saber o que falta explicar:  python main.py pendentes
#
# Regras (as mesmas do perfil):
# - Escreva para quem nunca acompanhou o Congresso: frases curtas, palavras do
#   dia a dia, termos técnicos explicados ("regime de resolução" = regras para
#   quando um banco quebra).
# - Só o que a ementa oficial diz, mais o significado comum dos termos. Nada de
#   números, prazos, efeitos ou consequências que a ementa não traga.
# - Sem opinião, ironia, adjetivo de valor ou previsão ("histórico", "polêmico",
#   "vai prejudicar", "importante"). Descreva, não avalie.
# - Não diga se foi aprovada ou rejeitada: o post já mostra isso.
# - Prenda a atenção pelo assunto, nunca pelo exagero: o tema pelo nome que as
#   pessoas usam ("MEI", "conta de luz", "escala 6x1") nas primeiras palavras,
#   a quem aquilo diz respeito ("quem é MEI") e o concreto no lugar do abstrato
#   ("quanto o MEI pode faturar", não "limite de receita bruta anual").
# - titulo: até 60 caracteres, é o texto grande da capa. Manchete curta, com o
#   assunto no começo (ex.: "Teto do MEI: muda quanto dá para faturar").
#   Se o projeto tiver apelido (apelidos.yaml ou Senado), o apelido vira o título.
# - resumo: 1 ou 2 frases, até 220 caracteres. A primeira responde "o que isso
#   tem a ver comigo?"; a segunda dá o detalhe.
#
# - detalhes: de 2 a 4 itens (até 100 caracteres cada), um para cada parte da
#   ementa, em palavras simples. Cubra TODAS as partes, sem omitir nenhuma (se
#   a ementa também perdoa dívidas ou muda prazos, isso entra na lista). Vão para
#   o slide "O que está em votação" e para a legenda.
# - chamada (opcional): até 70 caracteres, a frase do último slide. Liga o assunto
#   ao representante de quem lê ("Teto do MEI: e o deputado que você elegeu, como
#   votou?"). Nunca cita pessoa ou partido nem sugere como avaliar o voto.
# - gancho (opcional): a primeira linha da legenda, até 120 caracteres, falando
#   com quem é afetado ("Você é MEI? Este projeto muda o teto de faturamento."). Sem
#   alarme: nada de "urgente" ou "drasticamente".
# - hashtags (opcional): de 3 a 5 do assunto ("#MEI", "#SimplesNacional"). Nunca
#   de partido, político ou de apoio/oposição.
# - publico (opcional): até 40 caracteres, completa "Envie para ___" ("quem é MEI").
#
# Formato: a chave é a proposição exatamente como aparece no post.

"PLP 281/2019":
  titulo: Define regras para bancos e seguradoras em crise
  resumo: Define as regras para quando um banco, uma seguradora ou uma corretora de investimentos entra em crise ou quebra. Vale para empresas fiscalizadas pelo Banco Central, pela Susep e pela CVM.

"PEC 221/2019":
  titulo: Reduz a jornada semanal e prevê 2 dias de descanso
  resumo: Muda a Constituição para diminuir o número máximo de horas de trabalho por semana e garantir 2 dias de descanso remunerado por semana, sem corte de salário.

"PLP 186/2026":
  titulo: "Teto do MEI: muda quanto dá para faturar"
  resumo: Para quem é MEI, muda o limite de quanto se pode faturar por ano e de quantos empregados se pode ter. Essas regras ficam na lei do Simples Nacional.
  detalhes:
    - Muda o teto de quanto o MEI pode faturar por ano
    - Muda quantos empregados o MEI pode contratar
    - Perdoa dívidas que MEIs têm com o governo federal
    - Define como e quando essas regras passam a valer
  chamada: "Teto do MEI: e quem você elegeu, como votou?"
  gancho: Você é MEI? Este projeto muda o teto de faturamento e quantos empregados você pode ter.
  hashtags: ["#MEI", "#SimplesNacional", "#Empreendedorismo", "#PequenosNegócios"]
  publico: quem é MEI
