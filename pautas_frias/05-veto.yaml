titulo: O Congresso pode derrubar um veto?
resumo: Pode. O presidente da República pode barrar uma lei, e isso se chama veto. Mas a palavra final é do Congresso.
fonte: Constituição Federal, art. 66
slides:
  - tipo: numero
    numero: "15"
    rotulo: dias úteis para decidir
    texto: Depois que o Congresso aprova um projeto de lei, o presidente tem 15 dias úteis para aprovar (sancionar) ou barrar (vetar), no todo ou em parte. Se não fizer nada, o projeto é aprovado automaticamente.
  - tipo: texto
    titulo: Veto de uma parte
    texto: O veto de uma parte precisa cortar um trecho inteiro da lei, como um artigo ou um parágrafo. Não dá para vetar só uma palavra.
  - tipo: numero
    numero: "257 + 41"
    rotulo: votos para derrubar
    texto: Deputados e senadores analisam o veto juntos, numa sessão do Congresso. Para derrubar, é preciso o voto de mais da metade dos deputados (257) e dos senadores (41).
  - tipo: texto
    titulo: Prazo
    texto: O Congresso tem 30 dias para analisar o veto. Se passar disso, o veto passa na frente das outras votações nas sessões do Congresso.
  - tipo: texto
    titulo: Veto derrubado, e aí?
    texto: O trecho vetado volta para a lei e passa a valer depois de oficializado e publicado.
