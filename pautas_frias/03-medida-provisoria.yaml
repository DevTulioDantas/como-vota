titulo: "Medida Provisória: a lei que já começa valendo"
resumo: O presidente da República pode criar uma MP, que vale como lei na hora. Mas ela tem prazo para ser aprovada pelo Congresso.
fonte: Constituição Federal, art. 62
slides:
  - tipo: texto
    titulo: O que é
    texto: Em casos importantes e urgentes, o presidente da República pode criar uma Medida Provisória. Ela vale como lei desde o dia em que é publicada.
  - tipo: numero
    numero: "60 + 60"
    rotulo: dias de validade
    texto: A MP vale por 60 dias e pode ser prorrogada uma vez, por mais 60. Se o Congresso não aprovar nesse prazo, ela deixa de valer. O prazo fica parado nas férias do Congresso, o recesso.
  - tipo: numero
    numero: "45"
    rotulo: dias para travar as votações
    texto: Se não for votada em 45 dias, a MP passa na frente. A Câmara ou o Senado, onde ela estiver, não pode votar a maior parte dos outros projetos até decidir sobre ela.
  - tipo: texto
    titulo: Quando vira lei
    texto: Se a Câmara e o Senado aprovarem, a MP vira lei. Se mudarem o texto, ele vira um Projeto de Lei de Conversão (PLV), que vai para o presidente aprovar ou vetar.
  - tipo: texto
    titulo: Limites
    texto: "Uma MP não pode tratar, entre outros temas, de:"
    itens:
      - Nacionalidade, cidadania, direitos políticos e eleições
      - Crimes e processos criminais
    rodape: Uma MP rejeitada, ou que perdeu a validade, não pode ser criada de novo no mesmo ano de trabalho do Congresso.
