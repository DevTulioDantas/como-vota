titulo: "Do projeto à lei: o caminho no Congresso"
resumo: Uma proposta passa por várias etapas até virar lei. Veja o passo a passo de um projeto de lei.
fonte: Constituição Federal, arts. 58, 61, 64, 65 e 66
slides:
  - tipo: texto
    titulo: Quem pode apresentar
    texto: Deputados, senadores, as comissões do Congresso, o presidente da República, o STF e outros tribunais superiores, o procurador-geral da República e os próprios cidadãos (iniciativa popular).
  - tipo: passos
    titulo: Passo a passo
    passos:
      - "Apresentação: o projeto chega à Câmara ou ao Senado"
      - "Comissões: grupos menores analisam e podem mudar o texto"
      - "Plenário: todos os deputados ou senadores votam"
      - "A outra Casa (Câmara ou Senado) aprova, muda ou rejeita"
      - "Se o texto mudar, ele volta para onde começou"
      - "O presidente da República aprova ou veta"
  - tipo: texto
    titulo: Por onde começa
    texto: Projetos do presidente da República, do STF, dos tribunais superiores e dos cidadãos começam pela Câmara dos Deputados.
  - tipo: texto
    titulo: Atalho nas comissões
    texto: Em alguns casos, as comissões podem aprovar um projeto sem que todos os deputados ou senadores votem. Por isso, nem todo projeto aprovado aparece numa votação aqui no perfil.
