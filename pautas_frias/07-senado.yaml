titulo: Por que todo estado tem 3 senadores?
resumo: Enquanto a Câmara representa a população, o Senado representa os estados. Por isso, todos têm o mesmo número de vagas.
fonte: Constituição Federal, art. 46
slides:
  - tipo: numero
    numero: "81"
    rotulo: senadores
    texto: Cada estado e o Distrito Federal elegem 3 senadores, não importa quantas pessoas moram lá.
  - tipo: numero
    numero: "8 anos"
    rotulo: de mandato
    texto: O mandato de senador dura 8 anos, o dobro do mandato de deputado.
  - tipo: texto
    titulo: Eleição em partes
    texto: A cada 4 anos, há eleição para uma parte das vagas do Senado. Numa eleição, é um terço. Na seguinte, dois terços.
    itens:
      - "Um terço: 27 vagas, um senador por estado"
      - "Dois terços: 54 vagas, dois senadores por estado"
  - tipo: texto
    titulo: Ganha quem tem mais votos
    texto: Diferente dos deputados, os senadores são eleitos pelo sistema majoritário, em que vence quem tiver mais votos. Cada senador é eleito com dois suplentes, que podem assumir o lugar dele.
