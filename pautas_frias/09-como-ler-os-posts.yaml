titulo: Como ler os posts do Como Vota
resumo: O que significa cada voto, o que é orientação de partido e de onde vêm os dados.
fonte: Dados Abertos da Câmara dos Deputados e do Senado Federal
slides:
  - tipo: votos
    titulo: O que cada voto significa
    itens:
      - voto: Sim
        rotulo: SIM
        texto: A favor da questão em votação. Em destaques e requerimentos, vale só para aquela questão específica.
      - voto: Não
        rotulo: NÃO
        texto: Contra a questão em votação.
      - voto: Abstenção
        rotulo: ABSTENÇÃO
        texto: Registrou presença, mas não votou a favor nem contra.
      - voto: Obstrução
        rotulo: OBSTRUÇÃO
        texto: Na Câmara, forma de não contar para o quórum e tentar impedir ou adiar a votação.
      - voto: Ausente
        rotulo: NÃO VOTOU
        texto: Sem registro de voto. Pode ser falta, licença, missão oficial ou presidência da sessão.
  - tipo: texto
    titulo: Orientação de bancada
    texto: Antes de cada votação, os líderes dos partidos e do governo orientam como suas bancadas devem votar. Nos posts, mostramos quem votou diferente da orientação do próprio partido.
  - tipo: texto
    titulo: De onde vêm os dados
    texto: Todos os números vêm dos sistemas de Dados Abertos da Câmara e do Senado. O link da fonte oficial está na legenda de cada post.
  - tipo: texto
    titulo: Sem opinião
    texto: Não dizemos se um voto foi certo ou errado. Mostramos quem votou o quê, e a avaliação é sua.
