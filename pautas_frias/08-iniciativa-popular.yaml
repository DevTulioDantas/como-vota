titulo: Você pode propor uma lei?
resumo: Pode. A Constituição permite que os próprios cidadãos apresentem um projeto de lei à Câmara dos Deputados.
fonte: Constituição Federal, art. 61, § 2º
slides:
  - tipo: texto
    titulo: Iniciativa popular
    texto: Os próprios cidadãos podem apresentar um projeto de lei à Câmara dos Deputados, se reunirem assinaturas suficientes de eleitores. Isso se chama iniciativa popular.
  - tipo: numero
    numero: "1%"
    rotulo: dos eleitores do país
    texto: O projeto precisa ter a assinatura de pelo menos 1% dos eleitores do Brasil.
  - tipo: texto
    titulo: De vários estados
    texto: "Além do total, as assinaturas precisam vir de várias partes do país:"
    itens:
      - De pelo menos 5 estados
      - Com no mínimo 0,3% dos eleitores de cada um desses estados
  - tipo: texto
    titulo: Depois de apresentado
    texto: O projeto segue o mesmo caminho dos outros. Passa pelas comissões (grupos de deputados que analisam cada tema), pela votação de todos os deputados e pelo Senado. No fim, o presidente aprova ou veta.
