titulo: Por que SP tem 70 deputados e Roraima tem 8?
resumo: A Câmara representa a população. Por isso, o número de deputados de cada estado depende de quantas pessoas moram lá, com um mínimo e um máximo.
fonte: Constituição Federal, arts. 44 e 45
slides:
  - tipo: numero
    numero: "513"
    rotulo: deputados federais
    texto: O número de deputados de cada estado e do Distrito Federal segue o tamanho da população.
  - tipo: texto
    titulo: Mínimo e máximo
    texto: "A Constituição define limites:"
    itens:
      - Nenhum estado tem menos de 8 deputados
      - Nenhum estado tem mais de 70
  - tipo: texto
    titulo: Mandato de 4 anos
    texto: Primeiro, as vagas são divididas entre os partidos e federações, de acordo com os votos de cada um. Depois, elas vão para os candidatos mais votados de cada partido. Esse é o sistema proporcional.
  - tipo: texto
    titulo: Quem representa o seu estado?
    texto: Acompanhe a série Bancada do Estado aqui no perfil. Cada post mostra os deputados de um estado.
