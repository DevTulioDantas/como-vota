name: Voto da Semana

on:
  schedule:
    # sábados, 10h47 em Brasília (13h47 UTC), depois da semana de votações
    - cron: "47 13 * * 6"
  workflow_dispatch:
    inputs:
      parlamentar:
        description: "Nome do parlamentar (vazio = rodízio automático)"
        required: false
      casas:
        description: "camara, senado ou camara,senado"
        required: false
        default: "camara"
      forcar:
        description: "Gerar de novo mesmo se a semana já tiver post (true/false)"
        required: false
        default: "false"

permissions:
  contents: write
  actions: write   # para disparar o deploy do site

concurrency:
  group: como-vota-estado
  cancel-in-progress: false

jobs:
  semana:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restaurar imagens do branch midia
        run: bash scripts/midia.sh restaurar

      - name: Gerar Voto da Semana e enviar para aprovação
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELO: ${{ vars.GEMINI_MODELO }}
          IA_MODELO: ${{ vars.IA_MODELO }}
          IG_HANDLE: ${{ vars.IG_HANDLE }}
          SITE_TESTE_URL: ${{ vars.SITE_TESTE_URL }}
          CTA_TESTE: ${{ vars.CTA_TESTE }}
          TIKTOK_EXPORT: ${{ vars.TIKTOK_EXPORT }}
          REPOST_APOS_DIAS: ${{ vars.REPOST_APOS_DIAS }}
          CASAS_SEMANA: ${{ inputs.casas || vars.CASAS_SEMANA }}
          # campos do formulário entram como variáveis, nunca colados no script (evita injeção de comandos)
          PARLAMENTAR: ${{ inputs.parlamentar }}
          FORCAR: ${{ inputs.forcar }}
        run: |
          ARGS=()
          [ -n "$PARLAMENTAR" ] && ARGS+=(--parlamentar "$PARLAMENTAR")
          [ "$FORCAR" = "true" ] && ARGS+=(--forcar)
          python main.py semana "${ARGS[@]}"

      - name: Publicar imagens no branch midia (sem histórico)
        run: bash scripts/midia.sh publicar

      - name: Salvar rascunho e estado
        run: |
          git config user.name "como-vota-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Voto da Semana"
          git pull -q --rebase --autostash origin "$GITHUB_REF_NAME"
          git push

      - name: Atualizar o site (hospeda as imagens para o TikTok)
        if: vars.TIKTOK_MODO == 'rascunho' || vars.TIKTOK_MODO == 'direto'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref ${{ github.ref_name }}
