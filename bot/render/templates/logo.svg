{#- Logo "Como Vota, Deputado?" — cédula com SIM ✓ / NÃO ✕ / ABSTENÇÃO —, carimbo OFICIAL e assinatura.
    Variáveis: logo_mono (bool) = versão monocromática para avatar. -#}
{%- set c_papel = "#F6F3EC" -%}
{%- set c_tinta = "#101820" -%}
{%- set c_sim = "#F6F3EC" if logo_mono else "#1FA97A" -%}
{%- set c_nao = "#F6F3EC" if logo_mono else "#E4433C" -%}
{%- set c_abs = "#8A94A0" -%}
{%- set c_amarelo = "#FFC93C" -%}
<svg viewBox="0 0 1080 820" xmlns="http://www.w3.org/2000/svg" class="logo">
  <g transform="translate(140,40) scale(0.8)">
    {%- if logo_mono %}
    <rect x="0" y="0" width="800" height="560" rx="28" fill="none" stroke="{{ c_papel }}" stroke-width="10"/>
    {%- else %}
    <rect x="0" y="0" width="800" height="560" rx="28" fill="{{ c_papel }}" stroke="{{ c_tinta }}" stroke-width="8"/>
    {%- endif %}
    {%- set c_txt = c_papel if logo_mono else c_tinta %}
    <text x="48" y="120" font-family="Archivo Black" font-size="64" fill="{{ c_txt }}">SIM</text>
    <line x1="260" y1="130" x2="560" y2="130" stroke="{{ c_txt }}" stroke-width="6" stroke-dasharray="2 22" stroke-linecap="round"/>
    <path d="M620 80 l40 44 76 -96" fill="none" stroke="{{ c_sim }}" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="300" font-family="Archivo Black" font-size="64" fill="{{ c_txt }}">NÃO</text>
    <line x1="260" y1="310" x2="560" y2="310" stroke="{{ c_txt }}" stroke-width="6" stroke-dasharray="2 22" stroke-linecap="round"/>
    <path d="M640 240 l120 120 M760 240 l-120 120" stroke="{{ c_nao }}" stroke-width="26" stroke-linecap="round"/>
    <text x="48" y="480" font-family="Archivo Black" font-size="46" fill="{{ c_abs }}">ABSTENÇÃO</text>
    <line x1="420" y1="486" x2="560" y2="486" stroke="{{ c_abs }}" stroke-width="6" stroke-dasharray="2 22" stroke-linecap="round"/>
    <line x1="660" y1="470" x2="760" y2="470" stroke="{{ c_abs }}" stroke-width="26" stroke-linecap="round"/>
  </g>
  <g transform="translate(600,380) rotate(-10)">
    <rect x="0" y="0" width="300" height="96" rx="14" fill="none" stroke="{{ c_amarelo }}" stroke-width="10"/>
    <text x="150" y="66" text-anchor="middle" font-family="Archivo Black" font-size="48" fill="{{ c_amarelo }}">OFICIAL</text>
  </g>
  {%- if not logo_sem_nome %}
  <text x="540" y="700" text-anchor="middle" font-family="Archivo Black" font-size="96" fill="{{ c_papel }}">COMO VOTA</text>
  <text x="540" y="800" text-anchor="middle" font-family="Archivo Black" font-size="96" fill="{{ c_amarelo }}">{{ (cargo or "Deputado")|upper }}?</text>
  {%- endif %}
</svg>
