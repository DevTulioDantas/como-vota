<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Avatar do perfil: Congresso Nacional (Senado à esquerda, Câmara à direita) com ✓ SIM e ✕ NÃO.
       Fundo inteiro em azul: o Instagram e o TikTok recortam em círculo. -->
  <rect width="1080" height="1080" fill="#0E2233"/>
  <g transform="translate(0 40)">
  <g fill="#F6F3EC">
    <!-- torres gêmeas, ligadas no alto por uma passarela fina -->
    <rect x="472" y="250" width="56" height="440"/>
    <rect x="552" y="250" width="56" height="440"/>
    <rect x="528" y="330" width="24" height="26"/>
    <!-- cúpula do Senado (convexa) -->
    <path d="M196 690 A118 66 0 0 1 432 690 Z"/>
    <!-- cúpula da Câmara (côncava, a "tigela") -->
    <path d="M636 612 H896 C872 662 826 690 766 690 C706 690 660 662 636 612 Z"/>
    <!-- plataforma -->
    <rect x="150" y="706" width="780" height="44"/>
  </g>
  <!-- ✓ e ✕ -->
  <path d="M232 442 L292 502 L398 396" fill="none" stroke="#1FA97A" stroke-width="46"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M708 400 L824 516 M824 400 L708 516" fill="none" stroke="#E4433C" stroke-width="46"
        stroke-linecap="round"/>
  </g>
</svg>
